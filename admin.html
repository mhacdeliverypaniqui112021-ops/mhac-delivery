<header>
<div class="wrap">

<div class="brand">
MHAC <span class="pink">DELIVERY</span>
</div>

<small>ADMIN ORDER DASHBOARD</small>

</div>
</header>


<main class="wrap">

<!-- DASHBOARD STATS -->

<div class="dashboard">

<div class="stat">
<span>All Orders</span>
<b id="allCount">0</b>
</div>

<div class="stat">
<span>Pending</span>
<b id="pendingCount">0</b>
</div>

<div class="stat">
<span>Delivery</span>
<b id="deliveryCount">0</b>
</div>

<div class="stat">
<span>Completed</span>
<b id="completedCount">0</b>
</div>

</div>


<!-- CONTROLS -->

<div class="card">

<h2>📋 Orders</h2>

<button onclick="loadOrders()">
🔄 REFRESH ORDERS
</button>

<button class="dark" onclick="clearAllOrders()">
🗑️ CLEAR ALL ORDERS
</button>

</div>


<!-- ORDERS -->

<div id="orders">

<div class="empty">
No orders found.
</div>

</div>

</main>


<script>

/*
=================================================
MHAC DELIVERY ADMIN DASHBOARD
LOCAL STORAGE VERSION
=================================================
*/


function money(number){

return "₱"+Number(number).toLocaleString(
"en-PH",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


/* GET ORDERS */

function getOrders(){

let orders=[];

for(let i=0;i<localStorage.length;i++){

let key=localStorage.key(i);

if(!key) continue;

if(key.startsWith("MHAC_ORDER_")){

try{

let order=
JSON.parse(
localStorage.getItem(key)
);

if(order){
orders.push(order);
}

}catch(error){

console.error(error);

}

}

}


/* newest first */

orders.sort((a,b)=>{

return new Date(b.date)-new Date(a.date);

});

return orders;

}


/* LOAD */

function loadOrders(){

const orders=getOrders();

const container=
document.getElementById("orders");

container.innerHTML="";


/* COUNTERS */

let pending=0;
let delivery=0;
let completed=0;


orders.forEach(order=>{

let status=
(order.status||"Pending").toLowerCase();


if(status==="pending"){
pending++;
}

if(
status==="rider assigned"||
status==="picked up"||
status==="out for delivery"
){
delivery++;
}

if(status==="delivered"){
completed++;
}


});


document.getElementById("allCount")
.textContent=orders.length;

document.getElementById("pendingCount")
.textContent=pending;

document.getElementById("deliveryCount")
.textContent=delivery;

document.getElementById("completedCount")
.textContent=completed;


if(orders.length===0){

container.innerHTML=`

<div class="card empty">

<h2>📭 NO ORDERS YET</h2>

<p>
Orders created on this device will appear here.
</p>

</div>

`;

return;

}


/* DISPLAY ORDERS */

orders.forEach(order=>{

const div=
document.createElement("div");

div.className="order";

div.innerHTML=`

<div class="order-head">

<div>

<div class="order-id">
${escapeHTML(order.id)}
</div>

<small>
${escapeHTML(order.date||"")}
</small>

</div>

<span class="status">
${escapeHTML(order.status||"Pending")}
</span>

</div>


<h3>
🏪 ${escapeHTML(order.store||"")}
</h3>


<div class="info">

<div>
👤 <b>Customer</b><br>
${escapeHTML(order.customer||"")}
</div>

<div>
📱 <b>Mobile</b><br>
${escapeHTML(order.mobile||"")}
</div>

<div>
📍 <b>Municipality</b><br>
${escapeHTML(order.municipality||"")}
</div>

<div>
🏘️ <b>Barangay</b><br>
${escapeHTML(order.barangay||"")}
</div>

<div>
🏠 <b>Address</b><br>
${escapeHTML(order.address||"")}
</div>

<div>
📍 <b>Landmark</b><br>
${escapeHTML(order.landmark||"Not specified")}
</div>

<div>
📏 <b>Distance</b><br>
${Number(order.distanceKm||order.distance||0).toFixed(1)} km
</div>

<div>
💳 <b>Payment</b><br>
${escapeHTML(order.payment||"")}
</div>

</div>


<h3>🛍️ Items</h3>

<div>

${
Array.isArray(order.items)

? order.items.map(item=>`

<div style="
display:flex;
justify-content:space-between;
padding:6px 0;
border-bottom:1px solid #eee
">

<span>
${escapeHTML(item.name)}
× ${item.quantity}
</span>

<b>
${money(item.total)}
</b>

</div>

`).join("")

: "<small>Product details unavailable</small>"
}

</div>


<div class="total">

<div style="
display:flex;
justify-content:space-between;
font-size:14px;
font-weight:normal
">

<span>Total Order</span>

<span>
${money(order.subtotal||0)}
</span>

</div>


<div style="
display:flex;
justify-content:space-between;
font-size:14px;
font-weight:normal
">

<span>10% Service Fee</span>

<span>
${money(order.serviceFee||0)}
</span>

</div>


<div style="
display:flex;
justify-content:space-between;
font-size:14px;
font-weight:normal
">

<span>Delivery Fee</span>

<span>
${money(order.deliveryFee||0)}
</span>

</div>


<div style="
display:flex;
justify-content:space-between;
margin-top:8px
">

<span>GRAND TOTAL</span>

<span>
${money(order.grandTotal||0)}
</span>

</div>

</div>


<div style="margin-top:12px">

<label>
Update Status:
</label>

<select
onchange="changeStatus('${order.id}',this.value)"
>

<option
${order.status==="Pending"?"selected":""}>
Pending
</option>

<option
${order.status==="Confirmed"?"selected":""}>
Confirmed
</option>

<option
${order.status==="Preparing"?"selected":""}>
Preparing
</option>

<option
${order.status==="Ready for Pickup"?"selected":""}>
Ready for Pickup
</option>

<option
${order.status==="Rider Assigned"?"selected":""}>
Rider Assigned
</option>

<option
${order.status==="Picked Up"?"selected":""}>
Picked Up
</option>

<option
${order.status==="Out for Delivery"?"selected":""}>
Out for Delivery
</option>

<option
${order.status==="Delivered"?"selected":""}>
Delivered
</option>

<option
${order.status==="Cancelled"?"selected":""}>
Cancelled
</option>

</select>


<button
class="green"
onclick="confirmOrder('${order.id}')"
>
✅ CONFIRM
</button>


<button
class="blue"
onclick="contactCustomer('${order.mobile||""}')"
>
📞 CONTACT
</button>


<button
class="red"
onclick="deleteOrder('${order.id}')"
>
DELETE
</button>

</div>

`;

container.appendChild(div);

});

}


/* STATUS */

function changeStatus(orderId,status){

const key=
"MHAC_ORDER_"+orderId;

const data=
localStorage.getItem(key);

if(!data){
return;
}

try{

const order=JSON.parse(data);

order.status=status;

order.updatedAt=
new Date().toLocaleString();

localStorage.setItem(
key,
JSON.stringify(order)
);

loadOrders();

}catch(error){

console.error(error);

}

}


/* CONFIRM */

function confirmOrder(orderId){

changeStatus(
orderId,
"Confirmed"
);

alert(
"Order "+orderId+" confirmed."
);

}


/* CONTACT */

function contactCustomer(number){

if(!number){

alert(
"No mobile number available."
);

return;

}

window.location.href=
"tel:"+number;

}


/* DELETE */

function deleteOrder(orderId){

if(!confirm(
"Delete order "+orderId+"?"
)){

return;

}

localStorage.removeItem(
"MHAC_ORDER_"+orderId
);

loadOrders();

}


/* CLEAR */

function clearAllOrders(){

if(!confirm(
"WARNING: Delete ALL orders from this browser?"
)){

return;

}

const keys=[];

for(let i=0;i<localStorage.length;i++){

const key=localStorage.key(i);

if(
key &&
key.startsWith("MHAC_ORDER_")
){

keys.push(key);

}

}

keys.forEach(key=>{
localStorage.removeItem(key);
});

loadOrders();

}

<body>

<header>

<div class="wrap">

<div class="brand">
MHAC <span class="pink">DELIVERY</span>
</div>

<small>ADMIN CONTROL CENTER</small>

</div>

</header>


<main class="wrap">

<div class="stats">

<div class="stat">
ALL
<b id="all">0</b>
</div>

<div class="stat">
PENDING
<b id="pending">0</b>
</div>

<div class="stat">
PREPARING
<b id="preparing">0</b>
</div>

<div class="stat">
DELIVERY
<b id="delivery">0</b>
</div>

<div class="stat">
DELIVERED
<b id="delivered">0</b>
</div>

</div>


<div class="card">

<button onclick="loadOrders()">
🔄 REFRESH
</button>

<button class="dark" onclick="location.href='index.html'">
🛍️ CUSTOMER APP
</button>

<button class="dark" onclick="location.href='rider.html'">
🏍️ RIDER APP
</button>

</div>


<div id="orders"></div>

</main>


<script>

function money(n){

return "₱"+Number(n||0).toLocaleString(
"en-PH",
{
minimumFractionDigits:2,
maximumFractionDigits:2
});

}


function getOrders(){

let result=[];

for(let i=0;i<localStorage.length;i++){

let key=localStorage.key(i);

if(key && key.startsWith("MHAC_ORDER_")){

try{

result.push(
JSON.parse(localStorage.getItem(key))
);

}catch(e){}

}

}

result.sort((a,b)=>
new Date(b.date)-new Date(a.date)
);

return result;

}


function loadOrders(){

const orders=getOrders();

let pending=0;
let preparing=0;
let delivery=0;
let delivered=0;


orders.forEach(o=>{

if(o.status==="Pending")pending++;

if(o.status==="Preparing")preparing++;

if(
o.status==="Rider Assigned"||
o.status==="Picked Up"||
o.status==="Out for Delivery"
)delivery++;

if(o.status==="Delivered")delivered++;

});


document.getElementById("all").textContent=orders.length;

document.getElementById("pending").textContent=pending;

document.getElementById("preparing").textContent=preparing;

document.getElementById("delivery").textContent=delivery;

document.getElementById("delivered").textContent=delivered;


const box=document.getElementById("orders");

if(!orders.length){

box.innerHTML=`

<div class="card" style="text-align:center">

<h2>📭 NO ORDERS</h2>

<p>New customer orders will appear here.</p>

</div>

`;

return;

}


box.innerHTML=orders.map(o=>`

<div class="order ${o.status==="Pending"?"new":""}">

<div class="top">

<div>

<div class="orderid">
🆕 ${o.id}
</div>

<small>${o.date}</small>

</div>

<span class="status">
${o.status}
</span>

</div>


<div class="customer">

<b>CUSTOMER</b><br>

<strong>${safe(o.customer)}</strong><br>

📱 ${safe(o.mobile)}

</div>


<div class="grid">

<div class="info">
📍 <b>LOCATION</b><br>
${safe(o.barangay)}, ${safe(o.municipality)}
</div>

<div class="info">
🏠 <b>ADDRESS</b><br>
${safe(o.address)}
</div>

<div class="info">
📏 <b>DISTANCE</b><br>
${o.distance} KM
</div>

<div class="info">
🏪 <b>STORE</b><br>
${safe(o.store)}
</div>

<div class="info">
💳 <b>PAYMENT</b><br>
${safe(o.payment)}
</div>

<div class="info">
📌 <b>LANDMARK</b><br>
${safe(o.landmark||"None")}
</div>

</div>


<h3>🛍️ ORDER ITEMS</h3>

${(o.items||[]).map(item=>`

<div class="item">

<span>
${safe(item.name)} × ${item.quantity}
</span>

<b>
${money(item.total)}
</b>

</div>

`).join("")}


<div style="margin-top:12px">

<div class="item">
<span>Total Order</span>
<b>${money(o.subtotal)}</b>
</div>

<div class="item">
<span>10% Service Fee</span>
<b>${money(o.serviceFee)}</b>
</div>

<div class="item">
<span>Delivery Fee</span>
<b>${money(o.deliveryFee)}</b>
</div>

<div class="total">
GRAND TOTAL: ${money(o.grandTotal)}
</div>

</div>


<div style="margin-top:14px">

<select onchange="updateStatus('${o.id}',this.value)">

${[
"Pending",
"Confirmed",
"Preparing",
"Ready for Pickup",
"Rider Assigned",
"Picked Up",
"Out for Delivery",
"Delivered",
"Cancelled"
].map(s=>
`<option ${o.status===s?"selected":""}>${s}</option>`
).join("")}

</select>

<button class="green"
onclick="updateStatus('${o.id}','Confirmed')">
✅ CONFIRM
</button>

<button class="blue"
onclick="callCustomer('${o.mobile}')">
📞 CALL
</button>

<button class="dark"
onclick="assignRider('${o.id}')">
🏍️ RIDER
</button>

<button class="red"
onclick="deleteOrder('${o.id}')">
DELETE
</button>

</div>

</div>

`).join("");

}


function updateStatus(id,status){

const key="MHAC_ORDER_"+id;

let order=JSON.parse(
localStorage.getItem(key)
);

if(!order)return;

order.status=status;

order.updatedAt=
new Date().toLocaleString();

localStorage.setItem(
key,
JSON.stringify(order)
);

loadOrders();

}


function assignRider(id){

updateStatus(
id,
"Rider Assigned"
);

alert(
"Order "+id+" assigned to rider."
);

}


function callCustomer(number){

if(!number){
alert("No mobile number.");
return;
}

location.href="tel:"+number;

}


function deleteOrder(id){

if(!confirm(
"Delete "+id+"?"
))return;

localStorage.removeItem(
"MHAC_ORDER_"+id
);

loadOrders();

}


function safe(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}


loadOrders();

setInterval(
loadOrders,
3000
);

</script>
