<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MHAC DELIVERY — Admin Dashboard</title><style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,system-ui;
 background:#f3f4f7;
 color:#17171c
}
header{
 background:#17171c;
 color:#fff;
 padding:16px 20px;
 position:sticky;
 top:0;
 z-index:10
}
.header{
 max-width:1400px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center
}
.logo{font-size:23px;font-weight:900}
.pink{color:#ff4f7b}
.online{
 background:#173d2b;
 color:#55e391;
 padding:7px 12px;
 border-radius:20px;
 font-size:12px;
 font-weight:bold
}
.layout{
 max-width:1400px;
 margin:auto;
 display:grid;
 grid-template-columns:230px 1fr;
 min-height:calc(100vh - 65px)
}
.sidebar{
 background:#fff;
 border-right:1px solid #ddd;
 padding:18px
}
.menu{
 padding:13px;
 margin-bottom:7px;
 border-radius:10px;
 cursor:pointer;
 font-weight:bold
}
.menu.active,.menu:hover{
 background:#fff0f4;
 color:#ff4f7b
}
.main{padding:20px}
h1{margin-top:0}
.cards{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin-bottom:18px
}
.stat{
 background:#fff;
 border:1px solid #e1e2e6;
 border-radius:15px;
 padding:18px
}
.stat small{color:#777}
.stat strong{
 display:block;
 font-size:28px;
 margin-top:7px
}
.card{
 background:#fff;
 border:1px solid #e1e2e6;
 border-radius:15px;
 padding:18px;
 margin-bottom:18px
}
.toolbar{
 display:flex;
 gap:10px;
 margin-bottom:15px
}
input,select{
 width:100%;
 padding:11px;
 border:1px solid #d6d7dc;
 border-radius:9px;
 font:inherit
}
button{
 border:0;
 border-radius:9px;
 padding:10px 14px;
 font-weight:bold;
 cursor:pointer
}
.refresh{background:#17171c;color:#fff}
.orders{
 display:flex;
 flex-direction:column;
 gap:12px
}
.order{
 border:1px solid #ddd;
 border-radius:13px;
 padding:16px
}
.order-top{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center;
 border-bottom:1px solid #eee;
 padding-bottom:10px;
 margin-bottom:10px
}
.order-id{
 font-weight:900;
 font-size:17px
}
.status{
 padding:6px 10px;
 border-radius:20px;
 font-size:11px;
 font-weight:900
}
.pending{background:#fff4d6;color:#996b00}
.confirmed{background:#e8f1ff;color:#1761b0}
.preparing{background:#f2eaff;color:#7541b8}
.picked{background:#e8f8ff;color:#14728d}
.ontheway{background:#e7f8ed;color:#19834a}
.delivered{background:#dff7e8;color:#14743e}
.cancelled{background:#ffe5e5;color:#b42323}
.info{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 font-size:13px
}
.info div{
 background:#f7f7f9;
 padding:9px;
 border-radius:8px
}
.label{
 display:block;
 color:#777;
 font-size:10px;
 font-weight:bold;
 margin-bottom:3px
}
.money{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 margin-top:12px
}
.money div{
 background:#fafafa;
 padding:10px;
 border-radius:8px
}
.total{
 font-size:18px;
 font-weight:900
}
.actions{
 display:flex;
 gap:7px;
 margin-top:12px
}
.actions select{max-width:230px}
.empty{
 text-align:center;
 padding:40px;
 color:#777
}
@media(max-width:900px){
 .layout{grid-template-columns:1fr}
 .sidebar{display:flex;overflow:auto;border-right:0;border-bottom:1px solid #ddd}
 .menu{white-space:nowrap}
 .cards{grid-template-columns:repeat(2,1fr)}
 .info{grid-template-columns:1fr 1fr}
 .money{grid-template-columns:1fr 1fr}
}
@media(max-width:550px){
 .main{padding:12px}
 .cards{grid-template-columns:1fr 1fr}
 .info{grid-template-columns:1fr}
 .money{grid-template-columns:1fr 1fr}
 .toolbar{flex-direction:column}
 .order-top{align-items:flex-start;flex-direction:column}
}
</style></head><body><header>
<div class="header">
<div class="logo">MHAC <span class="pink">DELIVERY</span> — ADMIN</div>
<div class="online">● ADMIN ONLINE</div>
</div>
</header><div class="layout"><aside class="sidebar">
<div class="menu active">📊 Dashboard</div>
<div class="menu">📦 Orders</div>
<div class="menu">🛵 Riders</div>
<div class="menu">👥 Customers</div>
<div class="menu">🏪 Stores</div>
<div class="menu">⚙️ Settings</div>
</aside><main class="main"><h1>Dashboard</h1>
<p style="color:#777">MHAC DELIVERY order management</p><div class="cards"><div class="stat">
<small>TOTAL ORDERS</small>
<strong id="totalOrders">0</strong>
</div><div class="stat">
<small>PENDING</small>
<strong id="pendingOrders">0</strong>
</div><div class="stat">
<small>ON THE WAY</small>
<strong id="wayOrders">0</strong>
</div><div class="stat">
<small>DELIVERED</small>
<strong id="deliveredOrders">0</strong>
</div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
<div>
<h2 style="margin:0">📦 Orders</h2>
<small style="color:#777">Latest customer orders</small>
</div><button class="refresh" onclick="loadOrders()">↻ REFRESH</button>

</div><div class="toolbar" style="margin-top:15px"><input id="search"
placeholder="🔎 Search order, customer, mobile, address..."
oninput="renderOrders()">

<select id="statusFilter" onchange="renderOrders()">
<option value="">All Status</option>
<option>Pending</option>
<option>Confirmed</option>
<option>Preparing</option>
<option>Picked Up</option>
<option>On the Way</option>
<option>Delivered</option>
<option>Cancelled</option>
</select></div><div id="orders" class="orders"></div></div></main>
</div><script>

let orders=[];

function money(n){
 return "₱"+Number(n||0).toLocaleString("en-PH",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });
}

function statusClass(status){
 return String(status||"Pending")
 .toLowerCase()
 .replaceAll(" ","")
 .replace("pickedup","picked")
 .replace("ontheway","ontheway");
}

function loadOrders(){

 orders=[];

 /*
  DEMO MODE

  This loads orders saved by the customer
  on THIS SAME DEVICE/browser.

  Later we will connect this dashboard
  to Google Sheets so customer orders
  from other phones appear here.
 */

 for(let i=0;i<localStorage.length;i++){

  let key=localStorage.key(i);

  if(key && key.startsWith("MHAC_ORDER_")){

   try{
    let order=JSON.parse(localStorage.getItem(key));
    if(order) orders.push(order);
   }catch(e){}

  }
 }

 orders.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));

 updateStats();
 renderOrders();
}

function updateStats(){

 document.getElementById("totalOrders").textContent=orders.length;

 document.getElementById("pendingOrders").textContent=
 orders.filter(o=>o.status==="Pending").length;

 document.getElementById("wayOrders").textContent=
 orders.filter(o=>o.status==="On the Way").length;

 document.getElementById("deliveredOrders").textContent=
 orders.filter(o=>o.status==="Delivered").length;
}

function renderOrders(){

 let box=document.getElementById("orders");

 let search=document.getElementById("search").value.toLowerCase();
 let filter=document.getElementById("statusFilter").value;

 let filtered=orders.filter(o=>{

  let text=[
   o.id,
   o.customer,
   o.mobile,
   o.municipality,
   o.barangay,
   o.address,
   o.landmark
  ].join(" ").toLowerCase();

  let searchOK=!search||text.includes(search);
  let statusOK=!filter||o.status===filter;

  return searchOK&&statusOK;
 });

 if(filtered.length===0){

  box.innerHTML=`
  <div class="empty">
   📦<br><br>
   <b>No orders found</b><br>
   <small>Orders will appear here.</small>
  </div>`;

  return;
 }

 box.innerHTML=filtered.map(o=>{

  let status=o.status||"Pending";

  return `

  <div class="order">

   <div class="order-top">

    <div>
     <div class="order-id">${o.id||"NO ID"}</div>
     <small style="color:#777">${o.date||""}</small>
    </div>

    <span class="status ${statusClass(status)}">
     ${status}
    </span>

   </div>

   <div class="info">

    <div>
     <span class="label">CUSTOMER</span>
     <b>${o.customer||"-"}</b>
    </div>

    <div>
     <span class="label">MOBILE</span>
     ${o.mobile||"-"}
    </div>

    <div>
     <span class="label">STORE</span>
     ${o.store||"-"}
    </div>

    <div>
     <span class="label">MUNICIPALITY</span>
     ${o.municipality||"-"}
    </div>

    <div>
     <span class="label">BARANGAY</span>
     ${o.barangay||"-"}
    </div>

    <div>
     <span class="label">DISTANCE</span>
     ${o.distance||0} km
    </div>

    <div style="grid-column:1/-1">
     <span class="label">COMPLETE ADDRESS</span>
     ${o.address||"-"}
     ${o.landmark?`<br><small>📌 ${o.landmark}</small>`:""}
    </div>

   </div>

   <div class="money">

    <div>
     <span class="label">ORDER</span>
     <b>${money(o.subtotal)}</b>
    </div>

    <div>
     <span class="label">10% SERVICE</span>
     <b>${money(o.serviceFee)}</b>
    </div>

    <div>
     <span class="label">DELIVERY</span>
     <b>${money(o.deliveryFee)}</b>
    </div>

    <div>
     <span class="label">GRAND TOTAL</span>
     <span class="total">${money(o.grandTotal)}</span>
    </div>

   </div>

   <div style="margin-top:10px">
    💳 <b>Payment:</b> ${o.payment||"-"}
   </div>

   ${o.notes?`
   <div style="margin-top:8px;color:#666">
    📝 ${o.notes}
   </div>`:""}

   <div class="actions">

    <select onchange="changeStatus('${o.id}',this.value)">

     <option ${status==="Pending"?"selected":""}>Pending</option>
     <option ${status==="Confirmed"?"selected":""}>Confirmed</option>
     <option ${status==="Preparing"?"selected":""}>Preparing</option>
     <option ${status==="Picked Up"?"selected":""}>Picked Up</option>
     <option ${status==="On the Way"?"selected":""}>On the Way</option>
     <option ${status==="Delivered"?"selected":""}>Delivered</option>
     <option ${status==="Cancelled"?"selected":""}>Cancelled</option>

    </select>

    <button onclick="viewOrder('${o.id}')" style="background:#17171c;color:white">
     VIEW
    </button>

   </div>

  </div>

  `;

 }).join("");
}

function changeStatus(id,newStatus){

 let key="MHAC_ORDER_"+id;
 let order=localStorage.getItem(key);

 if(!order)return;

 try{

  order=JSON.parse(order);
  order.status=newStatus;

  localStorage.setItem(key,JSON.stringify(order));

  loadOrders();

 }catch(e){

  alert("Unable to update order.");

 }
}

function viewOrder(id){

 let order=orders.find(o=>o.id===id);

 if(!order)return;

 alert(
  "ORDER: "+order.id+
  "\n\nCUSTOMER: "+order.customer+
  "\nMOBILE: "+order.mobile+
  "\nADDRESS: "+order.address+
  "\nBARANGAY: "+order.barangay+
  "\nMUNICIPALITY: "+order.municipality+
  "\nDISTANCE: "+order.distance+" KM"+
  "\n\nORDER: "+money(order.subtotal)+
  "\nSERVICE FEE: "+money(order.serviceFee)+
  "\nDELIVERY FEE: "+money(order.deliveryFee)+
  "\nGRAND TOTAL: "+money(order.grandTotal)+
  "\n\nSTATUS: "+order.status
 );
}

loadOrders();

</script></body>
</html>
