<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>MHAC RIDER</title><link rel="stylesheet" href="../shared/style.css"></head><body>
<header class="top"><img class="logo" src="../assets/mhac-logo.jpg"><div><div class="brand">MHAC <span>RIDER</span></div><div class="tag">ASSIGNED ORDERS ONLY</div></div></header><main class="wrap">
<div class="nav"><button class="btn red" onclick="render()">REFRESH</button><button class="btn black" onclick="location.href='../customer/index.html'">CUSTOMER APP</button><button class="btn black" onclick="location.href='../admin/index.html'">ADMIN APP</button></div>
<section class="card"><h2>🏍️ MY ASSIGNED ORDERS</h2><p class="muted">For local testing, orders assigned by Admin appear here.</p><div id="orders"></div></section></main>
<script src="../shared/data.js"></script><script>
function render(){let os=MHAC.orders.filter(o=>o.assignedRider);orders.innerHTML=os.length?os.slice().reverse().map(o=>`<div class="order"><div class="row"><h3>${o.id}</h3><span class="status">${o.status}</span></div><p><b>${o.customer.name}</b><br>${o.customer.phone}<br>${o.customer.address}</p><p>${o.items.map(x=>`${x.qty}× ${x.name}${x.choice?" ("+x.choice+")":""}`).join("<br>")}</p><p class="total">₱${o.total.toFixed(2)}</p><div class="nav"><button class="btn black" onclick="update('${o.id}','ON THE WAY')">ON THE WAY</button><button class="btn red" onclick="update('${o.id}','DELIVERED')">DELIVERED</button></div></div>`).join(""):"<p class='muted'>No assigned orders.</p>"}function update(id,s){let o=MHAC.orders.find(x=>x.id===id);if(o){o.status=s;MHAC.save();render()}}render();
</script></body></html>
