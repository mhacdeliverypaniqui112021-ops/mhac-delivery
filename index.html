<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC DELIVERY • RIDER</title><link rel="stylesheet" href="../shared/style.css"></head><body>
<header class="top"><img class="logo" src="../assets/mhac-logo.jpg"><div><div class="brand">MHAC <span>RIDER</span></div><div class="tag">ASSIGNED ORDERS ONLY</div></div></header><main class="wrap">
<section class="rate"><h2>DELIVERY RATE</h2><p>First 1 km = <b>₱40</b> • Every succeeding km = <b>+₱10</b></p><p>Maximum 2 stores • 2nd store = <b>+₱5</b></p><p><b>Food Order + 10% Service Fee + Delivery Fee + Additional Store Fee</b></p></section>
<div class="nav"><button class="btn red" onclick="render()">REFRESH</button><button class="btn black" onclick="location.href='../'">CUSTOMER APP</button><button class="btn black" onclick="location.href='../admin/'">ADMIN APP</button></div>
<section class="card"><h2>🏍️ MY ASSIGNED ORDERS</h2><p class="muted">Only orders assigned by Admin are shown here.</p><div id="orders"></div></section></main>
<script src="../shared/data.js"></script><script>
function render(){let os=MHAC.orders.filter(o=>o.assignedRider);document.getElementById("orders").innerHTML=os.length?os.slice().reverse().map(o=>`<div class="order"><div class="row"><h3>${o.id}</h3><span class="status">${o.status}</span></div><p><b>${o.customer.name}</b><br>${o.customer.phone}<br>${o.customer.address}</p><p>${o.items.map(x=>`${x.qty}× ${x.name}${x.choice?" ("+x.choice+")":""}`).join("<br>")}</p><p class="total">₱${o.total.toFixed(2)}</p><div class="nav"><button class="btn black" onclick="update('${o.id}','ON THE WAY')">ON THE WAY</button><button class="btn red" onclick="update('${o.id}','DELIVERED')">DELIVERED</button></div></div>`).join(""):"<div class='notice'>Wala pang assigned order. Kapag nag-assign ang Admin, dito lang lalabas ang order.</div>"}
function update(id,s){let o=MHAC.orders.find(x=>x.id===id);if(o){o.status=s;MHAC.save();render()}}render();
</script></body></html>
