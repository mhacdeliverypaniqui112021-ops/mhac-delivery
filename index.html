<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ed1c24"><meta name="description" content="MHAC Delivery Customer Admin Rider App"><title>MHAC DELIVERY</title><style>
:root{--red:#ed1c24;--black:#111;--bg:#f7f7f7;--card:#fff;--muted:#707070;--line:#dedede}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#111}
button,input,select{font:inherit}button{cursor:pointer}
.top{background:#fff;border-bottom:5px solid var(--red);padding:14px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.logo{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--red)}
.brand{font-size:28px;font-weight:900}.brand span{color:var(--red)}.tag{font-size:16px;margin-top:5px;color:#222}
.wrap{max-width:760px;margin:auto;padding:18px}
.rate{background:#fff;border:3px solid var(--red);border-radius:28px;padding:24px 28px;margin:10px 0 18px}
.rate h2{color:var(--red);margin:0 0 16px;font-size:26px}.rate p{margin:10px 0;font-size:18px;line-height:1.5}
.mode{text-align:center;font-weight:800;color:#8c6500;margin:12px}
.card{background:var(--card);border:1px solid #ddd;border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 3px 15px #00000010}
h1,h2,h3{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.store,.cat{background:#fff;border:2px solid #ddd;border-radius:18px;padding:22px 12px;font-weight:800;font-size:18px;min-height:90px}
.store:hover,.cat:hover{border-color:var(--red);transform:translateY(-1px)}
.btn{padding:14px 18px;border-radius:14px;font-weight:800}.red{background:var(--red);color:#fff}.black{background:#111;color:#fff}
.product{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.product img{width:92px;height:76px;object-fit:contain;border-radius:12px;background:#fafafa}
.product .info{flex:1}.price{font-weight:900;margin-top:6px}.plus{width:44px;height:44px;border-radius:50%;background:var(--red);color:white;font-size:26px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted)}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;background:#fff;margin:6px 0 12px}
label{font-weight:700;font-size:14px}.total{font-size:24px;font-weight:900}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.nav .btn{flex:1;min-width:120px}
.order{border:1px solid #ddd;border-radius:18px;padding:16px;margin:12px 0;background:#fff}
.status{font-weight:900;color:var(--red)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px;font-weight:800}
.notice{padding:14px;border-radius:14px;background:#fff4f4;border:1px solid #f2c5c5}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:999px;z-index:99;display:none}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.brand{font-size:23px}.logo{width:66px;height:66px}.wrap{padding:12px}.rate p{font-size:17px}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>

MHAC.save=()=>{localStorage.setItem("mhac_cart",JSON.stringify(MHAC.cart));localStorage.setItem("mhac_orders",JSON.stringify(MHAC.orders))}
MHAC.foodTotal=()=>MHAC.cart.reduce((s,i)=>s+i.price*i.qty,0);
MHAC.storeCount=()=>[...new Set(MHAC.cart.map(i=>i.store))].length;
MHAC.deliveryFee=()=>{let km=Number(localStorage.getItem("mhac_km")||1);return Math.max(40,40+Math.max(0,Math.ceil(km)-1)*10)}
MHAC.serviceFee=()=>MHAC.foodTotal()*MHAC.rate.service;
MHAC.secondStoreFee=()=>Math.max(0,MHAC.storeCount()-1)*5;
MHAC.grandTotal=()=>MHAC.foodTotal()+MHAC.serviceFee()+MHAC.deliveryFee()+MHAC.secondStoreFee();

KKKLoD/9k=\"><div><div class=\"brand\">MHAC <span>DELIVERY</span></div><div class=\"tag\">FAST \u2022 SAFE \u2022 ON TIME</div></div></header><main class=\"wrap\"><div class=\"mode\">\ud83d\udfe1 OFFLINE / LOCAL MODE</div><div class=\"nav\"><button class=\"btn red\" onclick=\"showApp('admin')\">ADMIN APP</button><button class=\"btn black\" onclick=\"showApp('rider')\">RIDER APP</button></div><section class=\"card\"><h1>\ud83c\udf7d\ufe0f CHOOSE STORE</h1><p class=\"muted\">Select a store to browse categories and the complete menu.</p><div id=\"stores\" class=\"grid\"></div></section><section class=\"card\" id=\"menu\" style=\"display:none\"></section><section class=\"card\" id=\"cart\"><h2>\ud83d\uded2 YOUR CART</h2><p class=\"muted\">Your cart is empty.</p></section></main>"; window.history.replaceState(null,'','/mhac-delivery/');
   (function(){
let currentStore="",currentCat="";
const $=id=>document.getElementById(id), toast=m=>{let t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1800)};
function renderStores(){ $("stores").innerHTML=Object.keys(MHAC.stores).map(s=>`<button class="store" onclick="openStore(${JSON.stringify(s)})">${s==="Jollibee"?"🍗":s==="McDonald's"?"🍟":s==="Local Food"?"🍽️":"🍗"} ${s}</button>`).join("")}
function openStore(s){currentStore=s;currentCat="";let cats=Object.keys(MHAC.stores[s].categories);$("menu").style.display="block";$("menu").innerHTML=`<div class="row"><h2>${s}</h2><button class="btn black" onclick="this.closest('.card').style.display='none'">CLOSE</button></div><p class="muted">Choose a category</p><div class="grid">${cats.map(c=>`<button class="cat" onclick="openCat(${JSON.stringify(c)})">${c}</button>`).join("")}</div>`;$("menu").scrollIntoView({behavior:"smooth"})}
function openCat(c){currentCat=c;let items=MHAC.stores[currentStore].categories[c];$("menu").innerHTML=`<div class="row"><h2>${currentStore} • ${c}</h2><button class="btn black" onclick="openStore(${JSON.stringify(currentStore)})">BACK</button></div>${items.map(i=>`<div class="product"><img src="${i.img}"><div class="info"><b>${i.name}</b><div class="price">₱${i.price.toFixed(2)}</div></div><button class="plus" onclick="addProduct(${JSON.stringify(i.id)})">+</button></div>`).join("")}`;$("menu").scrollIntoView({behavior:"smooth"})}
function findProduct(id){for(let [s,o] of Object.entries(MHAC.stores))for(let [c,a] of Object.entries(o.categories))for(let p of a)if(p.id===id)return {...p,store:s,category:c}}
function addProduct(id){let p=findProduct(id),choice="",extra=0;if(p.addons){let text=p.addons.map((a,i)=>`${i+1}. ${a.name} (+₱${a.price})`).join("\\n");let x=prompt("Choose add-on:\\n"+text,"1");let n=Math.max(1,Math.min(p.addons.length,parseInt(x||"1")));choice=p.addons[n-1].name;extra=p.addons[n-1].price}let key=id+"|"+choice,old=MHAC.cart.find(x=>x.key===key);if(old)old.qty++;else MHAC.cart.push({key,id:p.id,name:p.name,price:p.price+extra,base:p.price,store:p.store,choice,qty:1});MHAC.save();renderCart();toast("Added to cart")}

function removeItem(n){MHAC.cart.splice(n,1);MHAC.save();renderCart()}
function checkout(){if(!MHAC.cart.length)return toast("Cart is empty");let name=prompt("Full Name");if(!name)return;let phone=prompt("Contact Number");if(!phone)return;let address=prompt("Complete Address / Landmark");if(!address)return;let order={id:"MHAC-"+Date.now().toString().slice(-7),created:new Date().toISOString(),customer:{name,phone,address},items:JSON.parse(JSON.stringify(MHAC.cart)),total:MHAC.grandTotal(),status:"ORDER RECEIVED",assignedRider:null};MHAC.orders.push(order);MHAC.cart=[];MHAC.save();renderCart();alert("ORDER RECEIVED\\nOrder No.: "+order.id+"\\nTotal: ₱"+order.total.toFixed(2));location.reload()}

;renderStores();renderCart();})()
