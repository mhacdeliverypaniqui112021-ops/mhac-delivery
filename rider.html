<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC DELIVERY • Rider App</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;color:#111}header{background:#08090b;color:#fff;border-bottom:4px solid #ed1118}.wrap{max-width:900px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:12px}.top img{width:55px;height:55px;border-radius:50%;object-fit:contain}.brand{font-size:24px;font-weight:900}.red{color:#ff3036}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}.tag{display:inline-block;padding:6px 9px;border-radius:99px;background:#111;color:#fff;font-size:12px;font-weight:900}.muted{color:#70737a;font-size:13px}button,select{padding:11px;border-radius:9px;border:0;font-weight:900}button{background:#ed1118;color:#fff}select{border:1px solid #ccc;background:#fff;width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.notice{background:#fff4f4;border:1px solid #ffc7c9;padding:12px;border-radius:12px}@media(max-width:650px){.row{flex-direction:column}}</style></head><body><header><div class="wrap top"><img src="logo.png"><div><div class="brand">MHAC <span class="red">DELIVERY</span></div><small>RIDER APP • ONLINE ORDERS</small></div></div></header><main class="wrap"><div class="card"><div class="row"><button onclick="location.href='index.html'">CUSTOMER APP</button><button onclick="location.href='admin.html'" style="background:#111">ADMIN APP</button><button onclick="location.href='admin-menu.html'" style="background:#e7e8ec;color:#111">MENU MANAGER</button></div><p data-online-status>🟡 OFFLINE / LOCAL MODE</p><h2>🛵 Rider Orders</h2><p class="muted">Orders assigned by Admin appear here in real time.</p></div><div id="orders"></div></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="mhac-online.js"></script><script>
const KEY="MHAC_DEMO_ORDERS";const STATUSES=["Accepted","Preparing","Picked Up","On the Way","Delivered"];let orders=[];function money(n){return "₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2})}function localGet(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}function syncLocal(o){let a=localGet().filter(x=>x.id!==o.id);a.push(o);localStorage.setItem(KEY,JSON.stringify(a));localStorage.setItem("MHAC_ORDER_"+o.id,JSON.stringify(o))}
async function setStatus(id,status){let o=orders.find(x=>x.id===id)||localGet().find(x=>x.id===id);if(!o)return;o.status=status;syncLocal(o);try{await updateOnlineOrder(id,{status})}catch(e){}render()}
function render(){let a=orders.filter(o=>o.status!=="Delivered"&&o.status!=="Cancelled");let b=document.getElementById("orders");if(!a.length){b.innerHTML='<div class="card"><p class="muted">No active rider orders. Admin must assign a rider first.</p></div>';return}b.innerHTML=a.slice().reverse().map(o=>`<div class="card"><span class="tag">${o.status}</span><h2>${o.id}</h2><p><b>${o.name||""}</b> • ${o.phone||""}<br>${o.address||""}<br>${o.barangay||""}, ${o.municipality||""}</p><p>Stores: ${(o.stores||[]).join(" + ")}<br>Distance: ${o.distanceKm?Number(o.distanceKm).toFixed(2)+" km":"—"}<br>Delivery fee: ${money(o.deliveryFee)}<br>Grand total: <b>${money(o.grandTotal)}</b><br>Assigned rider: <b>${o.rider||"Not assigned"}</b></p><details><summary>Ordered foods</summary><pre style="white-space:pre-wrap;font:inherit">${(o.items||[]).map(i=>`${i.qty}× ${i.name} (${i.store})${(i.addons||[]).length?" + "+i.addons.map(a=>a.name).join(", "):""}`).join("\n")}</pre></details><br><a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent((o.address||"")+', '+(o.barangay||"")+', '+(o.municipality||""))}" target="_blank"><button>🗺️ OPEN MAPS</button></a><br><br><select onchange="setStatus('${o.id}',this.value)">${STATUSES.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")}
if(window.listenOnlineOrders)window.listenOnlineOrders(a=>{orders=a||[];a.forEach(syncLocal);render()});render();
</script></body></html>
