<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17171c">
<title>MHAC DELIVERY — Rider</title><style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,system-ui;
 background:#f4f5f7;
 color:#17171c
}
header{
 background:#17171c;
 color:white;
 padding:16px
}
.wrap{
 max-width:900px;
 margin:auto;
 padding:15px
}
.logo{
 font-size:23px;
 font-weight:900
}
.pink{color:#ff4f7b}
.rider{
 color:#55e391;
 font-size:12px;
 font-weight:bold
}
.card{
 background:white;
 border:1px solid #ddd;
 border-radius:16px;
 padding:17px;
 margin-bottom:15px
}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px
}
.order{
 border:1px solid #ddd;
 border-radius:14px;
 padding:15px;
 margin-top:12px
}
.order-id{
 font-size:18px;
 font-weight:900
}
.status{
 display:inline-block;
 padding:6px 10px;
 border-radius:20px;
 background:#fff3cf;
 color:#936800;
 font-size:11px;
 font-weight:900
}
.info{
 margin-top:12px;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px
}
.info div{
 background:#f7f7f9;
 padding:10px;
 border-radius:9px;
 font-size:13px
}
.label{
 display:block;
 font-size:10px;
 color:#777;
 font-weight:bold;
 margin-bottom:4px
}
.money{
 margin-top:12px;
 padding:12px;
 background:#fff7f9;
 border-radius:10px
}
.total{
 font-size:21px;
 font-weight:900;
 color:#ff4f7b
}
button{
 width:100%;
 border:0;
 border-radius:10px;
 padding:12px;
 margin-top:9px;
 font-weight:900;
 cursor:pointer
}
.accept{background:#17171c;color:white}
.pickup{background:#ffb020;color:#17171c}
.way{background:#ff4f7b;color:white}
.delivered{background:#1c9b59;color:white}
.empty{
 text-align:center;
 padding:40px;
 color:#777
}
@media(max-width:600px){
 .info{grid-template-columns:1fr}
}
</style></head><body><header>
<div class="wrap"><div class="top">
<div>
<div class="logo">MHAC <span class="pink">DELIVERY</span></div>
<div>RIDER APP</div>
</div><div class="rider">● RIDER ONLINE</div>
</div></div>
</header><main class="wrap"><div class="card">
<h2>🛵 My Deliveries</h2>
<p style="color:#777">
Orders assigned to this rider will appear here.
</p><button onclick="loadOrders()" class="accept">
↻ REFRESH ORDERS
</button>
</div><div id="orders"></div></main><script>

let orders=[];

function money(n){

 return "₱"+Number(n||0).toLocaleString("en-PH",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });

}

function loadOrders(){

 orders=[];

 /*
  DEMO MODE:
  Reads MHAC orders saved on this device.
  Later we will connect this to the real
  online order database.
 */

 for(let i=0;i<localStorage.length;i++){

  let key=localStorage.key(i);

  if(key && key.startsWith("MHAC_ORDER_")){

   try{

    let order=JSON.parse(localStorage.getItem(key));

    if(order) orders.push(order);

   }catch(e){}

  }

 }

 renderOrders();

}

function renderOrders(){

 let box=document.getElementById("orders");

 if(orders.length===0){

  box.innerHTML=`
  <div class="card empty">
  🛵<br><br>
  <b>No delivery orders</b>
  <br>
  <small>Assigned orders will appear here.</small>
  </div>`;

  return;

 }

 box.innerHTML=orders.map(o=>{

  let status=o.status||"Pending";

  if(status==="Delivered" || status==="Cancelled"){
   return "";
  }

  return `

  <div class="card order">

   <div class="top">

    <div>
     <div class="order-id">${o.id}</div>
     <small>${o.date||""}</small>
    </div>

    <span class="status">${status}</span>

   </div>

   <hr>

   <div class="info">

    <div>
     <span class="label">CUSTOMER</span>
     <b>${o.customer||"-"}</b>
    </div>

    <div>
     <span class="label">MOBILE</span>
     ${o.mobile||"-"}
    </div>

    <div>
     <span class="label">MUNICIPALITY</span>
     ${o.municipality||"-"}
    </div>

    <div>
     <span class="label">BARANGAY</span>
     ${o.barangay||"-"}
    </div>

    <div style="grid-column:1/-1">
     <span class="label">DELIVERY ADDRESS</span>
     ${o.address||"-"}
    </div>

    <div style="grid-column:1/-1">
     <span class="label">LANDMARK</span>
     ${o.landmark||"No landmark"}
    </div>

    <div>
     <span class="label">DISTANCE</span>
     ${o.distance||0} KM
    </div>

    <div>
     <span class="label">PAYMENT</span>
     ${o.payment||"-"}
    </div>

   </div>

   <div class="money">

    <div>
     Order: <b>${money(o.subtotal)}</b>
    </div>

    <div>
     Service Fee: <b>${money(o.serviceFee)}</b>
    </div>

    <div>
     Delivery Fee: <b>${money(o.deliveryFee)}</b>
    </div>

    <div class="total">
     TOTAL: ${money(o.grandTotal)}
    </div>

   </div>

   ${getButtons(o)}

  </div>

  `;

 }).join("");

}

function getButtons(o){

 let status=o.status||"Pending";

 if(status==="Pending"){

  return `
  <button class="accept"
  onclick="updateStatus('${o.id}','Confirmed')">
  ACCEPT ORDER
  </button>`;

 }

 if(status==="Confirmed"){

  return `
  <button class="pickup"
  onclick="updateStatus('${o.id}','Picked Up')">
  📦 PICKED UP
  </button>`;

 }

 if(status==="Picked Up"){

  return `
  <button class="way"
  onclick="updateStatus('${o.id}','On the Way')">
  🛵 START DELIVERY
  </button>`;

 }

 if(status==="On the Way"){

  return `
  <button class="delivered"
  onclick="updateStatus('${o.id}','Delivered')">
  ✅ MARK AS DELIVERED
  </button>`;

 }

 return "";

}

function updateStatus(id,status){

 let key="MHAC_ORDER_"+id;

 let data=localStorage.getItem(key);

 if(!data){
  alert("Order not found.");
  return;
 }

 try{

  let order=JSON.parse(data);

  order.status=status;

  localStorage.setItem(
   key,
   JSON.stringify(order)
  );

  loadOrders();

 }catch(e){

  alert("Unable to update order.");

 }

}

loadOrders();

</script></body>
</html>
