<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC DELIVERY • Rider App</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;color:#111}header{background:#08090b;color:#fff;border-bottom:4px solid #ed1118}.wrap{max-width:900px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:12px}.top img{width:55px;height:55px;border-radius:50%;object-fit:contain}.brand{font-size:24px;font-weight:900}.red{color:#ff3036}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}.order{border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0}.tag{display:inline-block;padding:6px 9px;border-radius:99px;background:#111;color:#fff;font-size:12px;font-weight:900}.muted{color:#70737a;font-size:13px}button,select{padding:11px;border-radius:9px;border:0;font-weight:900}button{background:#ed1118;color:#fff}select{border:1px solid #ccc;background:#fff;width:100%}
</style></head><body><header><div class="wrap top"><img src="logo.png"><div><div class="brand">MHAC <span class="red">DELIVERY</span></div><small>RIDER APP</small></div></div></header>
<main class="wrap"><div class="card"><button onclick="location.href='index.html'">CUSTOMER APP</button> <button onclick="location.href='admin.html'" style="background:#111">ADMIN APP</button><h2>🛵 Rider Orders</h2><p class="muted">Demo mode: orders are shared on the same browser/device.</p></div><div id="orders"></div></main>
<script>
const KEY="MHAC_DEMO_ORDERS";const statuses=["Accepted","Preparing","Picked Up","On the Way","Delivered"];
function get(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function money(n){return"₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2})}
function setStatus(id,status){let a=get(),o=a.find(x=>x.id===id);if(!o)return;o.status=status;localStorage.setItem("MHAC_ORDER_"+id,JSON.stringify(o));save(a);render()}
function render(){let a=get().filter(o=>o.status!=="Delivered"&&o.status!=="Cancelled");let b=document.getElementById("orders");if(!a.length){b.innerHTML='<div class="card"><p class="muted">No active rider orders. Admin must assign/accept an order.</p></div>';return}b.innerHTML=a.slice().reverse().map(o=>`<div class="card order"><span class="tag">${o.status}</span><h2>${o.id}</h2><p><b>${o.name||""}</b> • ${o.phone||""}<br>${o.address||""}<br>${o.barangay||""}, ${o.municipality||""}</p><p>Stores: ${(o.stores||[]).join(" + ")}<br>Distance: ${o.distanceKm?Number(o.distanceKm).toFixed(2)+" km":"—"}<br>Delivery fee: ${money(o.deliveryFee)}<br>Grand total: <b>${money(o.grandTotal)}</b></p><a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent((o.address||"")+", "+(o.barangay||"")+", "+(o.municipality||""))}" target="_blank"><button>🗺️ OPEN MAPS</button></a><br><br><select onchange="setStatus('${o.id}',this.value)">${statuses.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")}
window.addEventListener("storage",render);setInterval(render,2000);render();
</script></body></html>
