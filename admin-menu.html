<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC DELIVERY • Admin Menu Manager</title>
<style>:root{--b:#08090b;--r:#ed1118;--g:#f3f4f6}*{box-sizing:border-box}body{margin:0;background:var(--g);font-family:Arial;color:#111}header{background:var(--b);color:#fff;padding:14px;border-bottom:4px solid var(--r)}.wrap{max-width:1100px;margin:auto;padding:16px}.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:900}.brand img{width:55px;height:55px;border-radius:50%;object-fit:cover}.red{color:#ff3036}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}.item{border:1px solid #ddd;border-radius:12px;padding:12px;margin:9px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.actions{display:flex;gap:6px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:9px 12px;background:var(--r);color:#fff;font-weight:900;cursor:pointer}button.dark{background:#111}button.gray{background:#e8e9ed;color:#111}.muted{color:#70737a;font-size:13px}.addon{border-top:1px solid #eee;padding:7px 0;display:flex;justify-content:space-between}@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}}</style></head>
<body><header><div class="wrap"><div class="brand"><img src="logo.png">MHAC <span class="red">DELIVERY</span></div><small>ADMIN • MENU MANAGER</small></div></header>
<main class="wrap"><div class="card"><div class="actions"><button onclick="addStore()">＋ ADD STORE</button><button class="dark" onclick="location.href='index.html'">CUSTOMER APP</button><button class="gray" onclick="location.href='admin.html'">ADMIN APP</button><button class="gray" onclick="location.href='rider.html'">RIDER APP</button><button class="gray" onclick="location.href='admin.html'">ORDERS DASHBOARD</button></div><p class="muted">Create/edit stores, menu labels, main foods and add-ons. Customer orders allow a maximum of 2 stores; the second store automatically adds ₱5.</p></div>
<div class="card"><h2>🏪 Stores</h2><div id="stores"></div></div><div class="card"><h2 id="title">Menu Builder</h2><div id="editor"><p class="muted">Select a store.</p></div></div></main>
<script>
const KEY="MHAC_MENU_V6", defaults=[{name:"Jollibee",icon:"🍗",labels:[{name:"Chicken Meals",foods:[{name:"Chickenjoy Meal",price:149,icon:"🍗",addons:[{name:"Softdrink",price:25},{name:"Large Fries",price:35},{name:"Extra Gravy",price:15}]},{name:"Jolly Spaghetti",price:129,icon:"🍝",addons:[{name:"Cheese",price:20},{name:"Chickenjoy",price:99}]}]}]},{name:"McDonald's",icon:"🍟",labels:[{name:"Meals",foods:[{name:"McChicken Meal",price:149,icon:"🍔",addons:[{name:"Medium Coke",price:30},{name:"Large Fries",price:25},{name:"Extra Patty",price:60}]},{name:"McNuggets Meal",price:159,icon:"🍗",addons:[{name:"Medium Fries",price:25},{name:"Coke",price:30}]}]}]}];
let menus=load(),active=menus[0]?.name||null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length)return x}catch(e){}return JSON.parse(JSON.stringify(defaults))}
function save(){localStorage.setItem(KEY,JSON.stringify(menus))}
function m(n){return"₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function st(){return menus.find(x=>x.name===active)}
function addStore(){let n=prompt("Store name:");if(!n?.trim())return;if(menus.some(x=>x.name.toLowerCase()===n.trim().toLowerCase()))return alert("Store already exists.");let icon=prompt("Store icon/emoji:","🍽️")||"🍽️";menus.push({name:n.trim(),icon,labels:[]});active=n.trim();save();render()}
function removeStore(i){if(!confirm("Remove "+menus[i].name+" and all menus?"))return;menus.splice(i,1);active=menus[0]?.name||null;save();render()}
function addLabel(){let s=st(),n=prompt("Menu label name:");if(!s||!n?.trim())return;s.labels.push({name:n.trim(),foods:[]});save();render()}
function editLabel(i){let s=st(),n=prompt("Rename label:",s.labels[i].name);if(n?.trim()){s.labels[i].name=n.trim();save();render()}}
function delLabel(i){if(confirm("Remove label and foods?")){st().labels.splice(i,1);save();render()}}
function addFood(li){let s=st(),n=prompt("Main food name:");if(!s||!n?.trim())return;let p=Number(prompt("Main food price:","100"));if(!Number.isFinite(p)||p<0)return alert("Invalid price.");let icon=prompt("Food icon:","🍽️")||"🍽️";s.labels[li].foods.push({name:n.trim(),price:p,icon,addons:[]});save();render()}
function editFood(li,fi){let f=st().labels[li].foods[fi],n=prompt("Food name:",f.name);if(!n?.trim())return;let p=Number(prompt("Price:",f.price));if(!Number.isFinite(p)||p<0)return;f.name=n.trim();f.price=p;save();render()}
function delFood(li,fi){if(confirm("Remove food?")){st().labels[li].foods.splice(fi,1);save();render()}}
function addAddon(li,fi){let f=st().labels[li].foods[fi],n=prompt("Add-on name:");if(!n?.trim())return;let p=Number(prompt("Add-on additional price:","20"));if(!Number.isFinite(p)||p<0)return;f.addons.push({name:n.trim(),price:p});save();render()}
function editAddon(li,fi,ai){let a=st().labels[li].foods[fi].addons[ai],n=prompt("Add-on name:",a.name);if(!n?.trim())return;let p=Number(prompt("Add-on price:",a.price));if(!Number.isFinite(p)||p<0)return;a.name=n.trim();a.price=p;save();render()}
function delAddon(li,fi,ai){st().labels[li].foods[fi].addons.splice(ai,1);save();render()}
function render(){document.getElementById("stores").innerHTML=menus.map((s,i)=>`<div class="item"><div class="head"><b style="font-size:18px">${esc(s.icon)} ${esc(s.name)}</b><div class="actions"><button onclick="active=${JSON.stringify(s.name)};render()">EDIT MENU</button><button class="dark" onclick="removeStore(${i})">REMOVE</button></div></div></div>`).join("")||"<p class='muted'>No stores.</p>";let s=st(),e=document.getElementById("editor");document.getElementById("title").textContent=s?"⚙️ "+s.icon+" "+s.name+" — Menu Builder":"Menu Builder";if(!s){e.innerHTML="<p class='muted'>Select a store.</p>";return}e.innerHTML=`<button onclick="addLabel()">＋ ADD MENU LABEL</button>${s.labels.map((l,li)=>`<div class="item"><div class="head"><h3>📋 ${esc(l.name)}</h3><div class="actions"><button class="gray" onclick="editLabel(${li})">RENAME</button><button class="dark" onclick="delLabel(${li})">REMOVE</button><button onclick="addFood(${li})">＋ ADD FOOD</button></div></div>${l.foods.map((f,fi)=>`<div class="item"><div class="head"><div><b>${esc(f.icon)} ${esc(f.name)}</b><br><span class="muted">${m(f.price)}</span></div><div class="actions"><button class="gray" onclick="editFood(${li},${fi})">EDIT</button><button class="dark" onclick="delFood(${li},${fi})">REMOVE</button><button onclick="addAddon(${li},${fi})">＋ ADD ADD-ON</button></div></div>${f.addons.map((a,ai)=>`<div class="addon"><span>↳ ${esc(a.name)}</span><span><b>+${m(a.price)}</b> <button class="gray" onclick="editAddon(${li},${fi},${ai})">EDIT</button> <button class="dark" onclick="delAddon(${li},${fi},${ai})">×</button></span></div>`).join("")||"<span class='muted'>No add-ons.</span>"}</div>`).join("")||"<p class='muted'>No foods yet.</p>"}</div>`).join("")}`}
render();
</script></body></html>
