<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC DELIVERY • Menu Manager</title>
<style>:root{--b:#08090b;--r:#ed1118;--g:#f3f4f6}*{box-sizing:border-box}body{margin:0;background:var(--g);font-family:Arial;color:#111}header{background:var(--b);color:#fff;padding:14px;border-bottom:4px solid var(--r)}.wrap{max-width:1100px;margin:auto;padding:16px}.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:900}.brand img{width:55px;height:55px;border-radius:50%;object-fit:cover}.red{color:#ff3036}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}.item{border:1px solid #ddd;border-radius:12px;padding:12px;margin:9px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.actions{display:flex;gap:6px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:9px 12px;background:var(--r);color:#fff;font-weight:900;cursor:pointer}button.dark{background:#111}button.gray{background:#e8e9ed;color:#111}.muted{color:#70737a;font-size:13px}.addon{border-top:1px solid #eee;padding:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.group{background:#fafafa;border:1px solid #ddd;border-radius:10px;padding:10px;margin-top:10px}.group h4{margin:0 0 8px;color:#ed1118}.pill{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:5px 8px;font-size:12px;margin:2px}@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}}</style></head>
<body><header><div class="wrap"><div class="brand"><img src="logo.png">MHAC <span class="red">DELIVERY</span></div><small>ADMIN • MENU MANAGER</small></div></header>
<main class="wrap">
<div class="card"><div class="actions"><button onclick="addStore()">＋ ADD STORE</button><button class="dark" onclick="location.href='index.html'">CUSTOMER APP</button><button onclick="publishMenus()">☁️ PUBLISH MENU ONLINE</button><button class="gray" onclick="location.href='admin.html'">ADMIN APP</button><button class="gray" onclick="location.href='rider.html'">RIDER APP</button></div><p data-online-status>🟡 OFFLINE / LOCAL MODE</p><p class="muted">Ito ang parehong menu database na ginagamit ng Customer App. Gumawa ng store → Menu Label → Main Food → Add-on Group (hal. Add Drinks) → choices at presyo.</p></div>
<div class="card"><h2>🏪 STORES</h2><div id="stores"></div></div>
<div class="card"><h2 id="title">MENU BUILDER</h2><div id="editor"><p class="muted">Pumili ng store.</p></div></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="mhac-online.js"></script><script>
const KEY="MHAC_MENU_V8_5"; const LEGACY=["MHAC_MENU_V8_4","MHAC_MENU_V6"];
const defaults=[
{name:"Jollibee",icon:"🍗",labels:[{name:"Burger List",foods:[{name:"Burger Solo",price:99,icon:"🍔",addonGroups:[{name:"Add Drinks",options:[{name:"Coke",price:20},{name:"Sprite",price:20},{name:"Royal",price:20},{name:"Iced Tea",price:25}]},{name:"Add-ons",options:[{name:"Extra Cheese",price:15},{name:"Extra Patty",price:45},{name:"Extra Sauce",price:10}]}]},{name:"Chicken Solo",price:129,icon:"🍗",addonGroups:[{name:"Add Drinks",options:[{name:"Coke",price:20},{name:"Sprite",price:20},{name:"Royal",price:20},{name:"Iced Tea",price:25}]},{name:"Add-ons",options:[{name:"Extra Rice",price:25},{name:"Extra Gravy",price:15},{name:"Extra Chicken",price:99}]}]}]}]},
{name:"McDonald's",icon:"🍟",labels:[{name:"Burger List",foods:[{name:"McBurger Solo",price:99,icon:"🍔",addonGroups:[{name:"Add Drinks",options:[{name:"Coke",price:25},{name:"Sprite",price:25},{name:"Iced Tea",price:30}]},{name:"Add-ons",options:[{name:"Extra Cheese",price:15},{name:"Extra Patty",price:50}]}]},{name:"McChicken",price:129,icon:"🍗",addonGroups:[{name:"Add Drinks",options:[{name:"Coke",price:25},{name:"Sprite",price:25},{name:"Iced Tea",price:30}]},{name:"Add-ons",options:[{name:"Extra Rice",price:25},{name:"Extra Sauce",price:10}]}]}]}]},
{name:"Local Food",icon:"🍽️",labels:[{name:"Burger List",foods:[{name:"Local Burger Solo",price:99,icon:"🍔",addonGroups:[{name:"Add Drinks",options:[{name:"Softdrink",price:20},{name:"Iced Tea",price:20}]},{name:"Add-ons",options:[{name:"Extra Cheese",price:15},{name:"Extra Patty",price:40}]}]},{name:"Local Chicken Solo",price:129,icon:"🍗",addonGroups:[{name:"Add Drinks",options:[{name:"Softdrink",price:20},{name:"Iced Tea",price:20}]},{name:"Add-ons",options:[{name:"Extra Rice",price:20},{name:"Extra Gravy",price:10}]}]}]}]} ,
{name:"Mang Inasal",icon:"🍗",labels:[
 {name:"Chicken List",foods:[{name:"Chicken BBQ Solo",price:129,icon:"🍗",addonGroups:[
  {name:"Add Drinks",options:[{name:"Iced Tea",price:25},{name:"Coke",price:25},{name:"Sprite",price:25}]},
  {name:"Add-ons",options:[{name:"Extra Rice",price:25},{name:"Extra Sauce",price:10}]}
 ]}]}
]},
{name:"KFC",icon:"🍗",labels:[
 {name:"Chicken List",foods:[{name:"1pc Chicken Solo",price:129,icon:"🍗",addonGroups:[
  {name:"Add Drinks",options:[{name:"Coke",price:25},{name:"Sprite",price:25},{name:"Iced Tea",price:30}]},
  {name:"Add-ons",options:[{name:"Extra Rice",price:25},{name:"Extra Gravy",price:15}]}
 ]}]}
]}
];
let menus=load(),active=menus[0]?.name||null;
function load(){let x=null;try{x=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!Array.isArray(x)||!x.length){for(const k of LEGACY){try{let old=JSON.parse(localStorage.getItem(k));if(Array.isArray(old)&&old.length){x=old;break}}catch(e){}}}if(!Array.isArray(x)||!x.length)x=JSON.parse(JSON.stringify(defaults));
 x.forEach(s=>(s.labels||[]).forEach(l=>(l.foods||[]).forEach(f=>{if(!Array.isArray(f.addonGroups))f.addonGroups=[];if(Array.isArray(f.addons)&&f.addons.length){f.addonGroups.push({name:"Add-ons",options:f.addons.map(a=>({name:a.name,price:Number(a.price)||0}))});delete f.addons}})));return x}
function save(){localStorage.setItem(KEY,JSON.stringify(menus))}function st(){return menus.find(x=>x.name===active)}function m(n){return "₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2})}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":'&#39;'}[c]))}
function addStore(){let n=prompt("Store name:");if(!n?.trim())return;if(menus.some(x=>x.name.toLowerCase()===n.trim().toLowerCase()))return alert("Store already exists.");let icon=prompt("Store icon/emoji:","🍽️")||"🍽️";menus.push({name:n.trim(),icon,labels:[]});active=n.trim();save();render()}
function removeStore(i){if(!confirm("Remove "+menus[i].name+" and all menus?"))return;menus.splice(i,1);active=menus[0]?.name||null;save();render()}
function addLabel(){let s=st(),n=prompt("Menu label name (example: Burger List):");if(!s||!n?.trim())return;if(s.labels.some(l=>l.name.toLowerCase()===n.trim().toLowerCase()))return alert("Menu label already exists.");s.labels.push({name:n.trim(),foods:[]});save();render()}
function editLabel(i){let s=st(),n=prompt("Rename label:",s.labels[i].name);if(n?.trim()){s.labels[i].name=n.trim();save();render()}}
function delLabel(i){if(confirm("Remove label and all foods?")){st().labels.splice(i,1);save();render()}}
function addFood(li){let s=st(),n=prompt("Main food name:");if(!s||!n?.trim())return;let p=Number(prompt("Main food price:","99"));if(!Number.isFinite(p)||p<0)return alert("Invalid price.");let icon=prompt("Food icon:","🍽️")||"🍽️";s.labels[li].foods.push({name:n.trim(),price:p,icon,addonGroups:[]});save();render()}
function editFood(li,fi){let f=st().labels[li].foods[fi],n=prompt("Food name:",f.name);if(!n?.trim())return;let p=Number(prompt("Price:",f.price));if(!Number.isFinite(p)||p<0)return;f.name=n.trim();f.price=p;save();render()}
function delFood(li,fi){if(confirm("Remove food?")){st().labels[li].foods.splice(fi,1);save();render()}}
function addGroup(li,fi){let f=st().labels[li].foods[fi];f.addonGroups=f.addonGroups||[];let n=prompt("Add-on group name (example: Add Drinks):");if(!n?.trim())return;if(f.addonGroups.some(g=>g.name.toLowerCase()===n.trim().toLowerCase()))return alert("Group already exists.");f.addonGroups.push({name:n.trim(),options:[]});save();render()}
function editGroup(li,fi,gi){let g=st().labels[li].foods[fi].addonGroups[gi],n=prompt("Group name:",g.name);if(n?.trim()){g.name=n.trim();save();render()}}
function delGroup(li,fi,gi){if(confirm("Remove this add-on group and all its choices?")){st().labels[li].foods[fi].addonGroups.splice(gi,1);save();render()}}
function addOption(li,fi,gi){let g=st().labels[li].foods[fi].addonGroups[gi],n=prompt("Choice name (example: Coke):");if(!n?.trim())return;let p=Number(prompt("Additional price:","20"));if(!Number.isFinite(p)||p<0)return alert("Invalid price.");g.options.push({name:n.trim(),price:p});save();render()}
function editOption(li,fi,gi,oi){let a=st().labels[li].foods[fi].addonGroups[gi].options[oi],n=prompt("Choice name:",a.name);if(!n?.trim())return;let p=Number(prompt("Additional price:",a.price));if(!Number.isFinite(p)||p<0)return;a.name=n.trim();a.price=p;save();render()}
function delOption(li,fi,gi,oi){st().labels[li].foods[fi].addonGroups[gi].options.splice(oi,1);save();render()}
function reset(){if(!confirm("Reset the 3 testing stores to the sample menus?"))return;menus=JSON.parse(JSON.stringify(defaults));active="Jollibee";save();render()}
async function publishMenus(){try{await saveOnlineMenus(menus);alert("✅ Menu published online. Customer phones can now receive the updated menu.");}catch(e){alert("❌ Firebase is not connected yet. Add your Firebase config first.");console.error(e)}}
function render(){
 const stores=document.getElementById("stores");
 stores.innerHTML=menus.map((s,i)=>`<div class="item"><div class="head"><b style="font-size:18px">${esc(s.icon)} ${esc(s.name)}</b><div class="actions"><button onclick="active=${JSON.stringify(s.name)};render()">EDIT MENU</button><button class="dark" onclick="removeStore(${i})">REMOVE</button></div></div><div class="muted">${(s.labels||[]).length} menu label(s)</div></div>`).join("")||"<p class='muted'>No stores.</p>";
 const s=st(), e=document.getElementById("editor");
 document.getElementById("title").textContent=s?"⚙️ "+s.icon+" "+s.name+" — Menu Builder":"Menu Builder";
 if(!s){e.innerHTML="<p class='muted'>Select a store.</p>";return}
 let html=`<div class="actions"><button onclick="addLabel()">＋ ADD MENU LABEL</button><button class="dark" onclick="reset()">RESET TEST MENUS</button></div>`;
 for(let li=0;li<s.labels.length;li++){
   const l=s.labels[li];
   html+=`<div class="item"><div class="head"><h3>📋 ${esc(l.name)}</h3><div class="actions"><button class="gray" onclick="editLabel(${li})">RENAME</button><button class="dark" onclick="delLabel(${li})">REMOVE</button><button onclick="addFood(${li})">＋ ADD FOOD</button></div></div>`;
   if(!l.foods.length) html+=`<p class="muted">No foods yet.</p>`;
   for(let fi=0;fi<l.foods.length;fi++){
     const f=l.foods[fi];
     html+=`<div class="item"><div class="head"><div><b>${esc(f.icon||"🍽️")} ${esc(f.name)}</b><br><span class="muted">${m(f.price)}</span></div><div class="actions"><button class="gray" onclick="editFood(${li},${fi})">EDIT FOOD</button><button onclick="addGroup(${li},${fi})">＋ ADD ADD-ON GROUP</button><button class="dark" onclick="delFood(${li},${fi})">REMOVE FOOD</button></div></div>`;
     if(!f.addonGroups || !f.addonGroups.length) html+=`<p class="muted">No add-on groups yet. Example: Add Drinks.</p>`;
     for(let gi=0;gi<(f.addonGroups||[]).length;gi++){
       const g=f.addonGroups[gi];
       html+=`<div class="group"><div class="head"><h4>⚙️ ${esc(g.name)}</h4><div class="actions"><button class="gray" onclick="editGroup(${li},${fi},${gi})">RENAME</button><button class="dark" onclick="delGroup(${li},${fi},${gi})">REMOVE GROUP</button><button onclick="addOption(${li},${fi},${gi})">＋ ADD CHOICE</button></div></div>`;
       if(!g.options.length) html+=`<span class="muted">No choices yet.</span>`;
       for(let oi=0;oi<g.options.length;oi++){
         const o=g.options[oi];
         html+=`<div class="addon"><span>↳ ${esc(o.name)} <b>+${m(o.price)}</b></span><span><button class="gray" onclick="editOption(${li},${fi},${gi},${oi})">EDIT</button> <button class="dark" onclick="delOption(${li},${fi},${gi},${oi})">×</button></span></div>`;
       }
       html+=`</div>`;
     }
     html+=`</div>`;
   }
   html+=`</div>`;
 }
 e.innerHTML=html;
}
render();
if(window.listenOnlineMenus){window.listenOnlineMenus(m=>{menus=m;active=menus[0]?.name||null;save();render();});}
</script></body></html>
